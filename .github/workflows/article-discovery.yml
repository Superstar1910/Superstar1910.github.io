name: Discover published articles
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Discover candidate Substack and Medium publications
        run: python scripts/discover_articles.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: article-import-candidates
          path: data/article-import-candidates.json
          retention-days: 30
