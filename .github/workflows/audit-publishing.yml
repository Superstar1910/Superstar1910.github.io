name: Audit static publishing
on:
  push:
    paths:
      - 'writing/**'
      - 'research/**'
      - 'static/**'
      - 'scripts/audit_publishing.py'
      - 'scripts/audit_navigation.py'
      - 'scripts/build_article_feeds.py'
      - 'scripts/validate_articles.py'
      - '.nojekyll'
      - 'CNAME'
      - '.github/workflows/audit-publishing.yml'
  pull_request:
    paths:
      - 'writing/**'
      - 'research/**'
      - 'static/**'
      - 'scripts/**'
      - '.nojekyll'
      - 'CNAME'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate article metadata
        run: python scripts/validate_articles.py
      - name: Audit static pages and syndication
        run: python scripts/audit_publishing.py
      - name: Audit internal links and navigation
        run: python scripts/audit_navigation.py
