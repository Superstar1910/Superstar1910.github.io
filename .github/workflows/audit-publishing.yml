name: Audit static publishing
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate article metadata
        run: python scripts/validate_articles.py
      - name: Audit static pages and syndication
        run: python scripts/audit_publishing.py
      - name: Audit internal links and navigation
        run: python scripts/audit_navigation.py
