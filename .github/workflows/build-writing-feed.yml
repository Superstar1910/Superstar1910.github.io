name: Build writing feed
on:
  workflow_dispatch:
  push:
    paths:
      - 'static/data/articles.json'
      - 'scripts/build_article_feeds.py'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_articles.py
      - run: python scripts/build_article_feeds.py
      # main is protected (ruleset "Protect main"), so this job no longer pushes.
      # The deploy build regenerates the feed and sitemap on every publish.
      - name: Report feed and sitemap drift
        run: |
          if ! git diff --quiet -- writing/feed.xml writing/sitemap.xml; then
            echo "::notice::writing/feed.xml or writing/sitemap.xml is out of date. Run scripts/build_article_feeds.py in a pull request to refresh the committed copies; the published site is regenerated on deploy."
          fi
