name: Build writing feed
on:
  workflow_dispatch:
  push:
    paths:
      - 'static/data/articles.json'
      - 'scripts/build_article_feeds.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_articles.py
      - run: python scripts/build_article_feeds.py
      - name: Commit generated feed and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing/feed.xml writing/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh approved article RSS and sitemap"
            git push
          fi
