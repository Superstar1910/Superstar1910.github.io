name: Import approved visual-library bundle
on:
  push:
    branches:
      - 'intake/legesi-visuals-*'
    paths:
      - 'imports/legesi_visual_publication_web_batch*.zip'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Superstar1910/Superstar1910.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check and import approved image files
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(imports/legesi_visual_publication_web_batch*.zip)
          if (( ${#bundles[@]} == 0 )); then
            echo 'No approved visual-library ZIP in intake folder' >&2
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            python scripts/import_visual_library_bundle.py "$bundle" --dry-run
            python scripts/import_visual_library_bundle.py "$bundle"
          done
          python scripts/validate_visual_library.py
      - name: Commit images and catalogue without intake ZIP
        shell: bash
        run: |
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/visuals static/data/visual-library.json
          bundles=(imports/legesi_visual_publication_web_batch*.zip)
          if (( ${#bundles[@]} )); then
            git rm -- "${bundles[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Import approved final visuals and validated catalogue"
            git push
          fi
