name: Import approved visual-library bundle
on:
  push:
    branches:
      - 'intake/legesi-visuals-*'
    paths:
      - 'imports/legesi_visual_publication_web_batch_18.zip'
      - 'imports/legesi_visual_publication_web_batch_23.zip'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Superstar1910/Superstar1910.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check and import the approved image files
        run: |
          for bundle in imports/legesi_visual_publication_web_batch_18.zip imports/legesi_visual_publication_web_batch_23.zip; do
            if [ -f "$bundle" ]; then
              python scripts/import_visual_library_bundle.py "$bundle" --dry-run
              python scripts/import_visual_library_bundle.py "$bundle"
            fi
          done
          python scripts/validate_visual_library.py
      - name: Commit prepared images, catalogue and remove intake bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/visuals static/data/visual-library.json
          for bundle in imports/legesi_visual_publication_web_batch_18.zip imports/legesi_visual_publication_web_batch_23.zip; do
            if [ -f "$bundle" ]; then git rm "$bundle"; fi
          done
          git diff --cached --quiet || git commit -m "Import approved final visuals and validated catalogue"
          git push
