name: Performance baseline
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/performance-audit.yml', 'static/css/**', 'index.html', 'writing/index.html', 'scripts/build_site.py']
  schedule:
    - cron: '15 7 * * 1'
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/build_site.py
      - name: Install exact measurement tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/lighthouse-tools" --no-save --ignore-scripts playwright@1.56.1 lighthouse@12.8.2
          "$RUNNER_TEMP/lighthouse-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Measure representative pages with mobile defaults
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/lighthouse-server.log 2>&1 &
          mkdir -p test-results/performance
          export CHROME_PATH="$(node -e 'console.log(require(process.env.RUNNER_TEMP + "/lighthouse-tools/node_modules/playwright").chromium.executablePath())')"
          "$RUNNER_TEMP/lighthouse-tools/node_modules/.bin/lighthouse" http://127.0.0.1:8765/ --chrome-flags='--headless --no-sandbox' --output=json --output=html --output-path=test-results/performance/home --quiet
          "$RUNNER_TEMP/lighthouse-tools/node_modules/.bin/lighthouse" http://127.0.0.1:8765/work/ --chrome-flags='--headless --no-sandbox' --output=json --output=html --output-path=test-results/performance/work --quiet
          "$RUNNER_TEMP/lighthouse-tools/node_modules/.bin/lighthouse" http://127.0.0.1:8765/writing/ --chrome-flags='--headless --no-sandbox' --output=json --output=html --output-path=test-results/performance/writing --quiet
          node - <<'JS'
          const fs=require('fs');for(const name of ['home','work','writing']){const x=JSON.parse(fs.readFileSync('test-results/performance/'+name+'.report.json'));console.log(JSON.stringify({page:name,tool:x.lighthouseVersion,performance:x.categories.performance.score,accessibility:x.categories.accessibility.score,lcp:x.audits['largest-contentful-paint'].numericValue,cls:x.audits['cumulative-layout-shift'].numericValue,tbt:x.audits['total-blocking-time'].numericValue}));}
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-baseline
          path: test-results/performance/
          retention-days: 30
