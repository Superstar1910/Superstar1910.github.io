name: Site quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build shared components and directories
        run: python scripts/build_site.py
      - name: Validate publication and navigation contracts
        run: |
          python scripts/validate_articles.py
          python scripts/audit_publishing.py
          python scripts/audit_navigation.py
          python scripts/audit_coherence.py
          python scripts/audit_urls.py
          python scripts/audit_editorial.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Responsive browser and no-JavaScript checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/legesi-qa.log 2>&1 &
          node scripts/browser_qa.cjs
          node scripts/url_qa.cjs
      - name: Package approved public files
        run: python scripts/package_site.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: site-quality-evidence
          path: test-results/
          retention-days: 14
